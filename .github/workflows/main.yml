name: "Compilar APK de Godot"

on:
  push:
    branches: [ "main", "master" ]

jobs:
  export-android:
    name: Compilando Android en la nube
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo fuente
        uses: actions/checkout@v4

      - name: Configurar Java (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Descargar e instalar Android SDK Manual
        run: |
          mkdir -p $HOME/android-sdk/cmdline-tools
          cd $HOME/android-sdk/cmdline-tools
          # Descarga las herramientas de consola oficiales de Google
          wget https://google.com
          unzip commandlinetools-linux-11076708_latest.zip
          mv cmdline-tools latest
          
          # Configurar variables de entorno indispensables para Godot
          echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
          echo "PATH=$PATH:$HOME/android-sdk/cmdline-tools/latest/bin:$HOME/android-sdk/platform-tools" >> $GITHUB_ENV

      - name: Aceptar Licencias e Instalar Componentes
        run: |
          # Acepta de forma automática las licencias obligatorias de Google
          yes | $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager --licenses
          # Instala los build tools requeridos
          $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Descargar e Instalar Godot 4.7.2 y Plantillas
        run: |
          # Descarga el motor Godot versión Linux
          wget https://github.com
          unzip Godot_v4.7.2-stable_linux.x86_64.zip
          mv Godot_v4.7.2-stable_linux.x86_64 godot
          chmod +x godot
          
          # Descarga e instala el pack de plantillas universales (.tpz)
          wget https://github.com
          mkdir -p ~/.local/share/godot/export_templates/4.7.2.stable
          unzip Godot_v4.7.2-stable_export_templates.tpz -d ~/.local/share/godot/export_templates/4.7.2.stable
          mv ~/.local/share/godot/export_templates/4.7.2.stable/templates/* ~/.local/share/godot/export_templates/4.7.2.stable/

      - name: Crear carpeta de salida
        run: mkdir -v -p build/android

      - name: Exportar videojuego a APK
        run: |
          ./godot --headless --export-release "Android" build/android/mi_juego.apk
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}

      - name: Guardar el APK final como descarga
        uses: actions/upload-artifact@v4
        with:
          name: Juego_Android_APK
          path: build/android/mi_juego.apk
