name: "Exportar juego (Android y Windows)"

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:   # permite ejecutarlo a mano desde la pestaña Actions

env:
  GODOT_VERSION: "4.7.2"
  GODOT_RELEASE: "stable"

jobs:
  # ==========================================================
  # ANDROID (.apk)
  # ==========================================================
  export-android:
    name: Android (APK)
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código fuente
        uses: actions/checkout@v4

      - name: Revisar que existe el preset "Android"
        run: |
          if [ ! -f project.godot ]; then
            echo "::error::No encuentro project.godot en la raíz del repositorio."
            exit 1
          fi
          if [ ! -f export_presets.cfg ]; then
            echo "::error::Falta export_presets.cfg. En Godot: Proyecto > Exportar > Añadir > Android, y sube ese archivo a GitHub."
            exit 1
          fi
          if ! grep -q 'name="Android"' export_presets.cfg; then
            echo "::error::El preset se debe llamar exactamente Android (revisa Proyecto > Exportar)."
            exit 1
          fi
      - name: Configurar Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'   # el paquete "tools" que trae por defecto ya no existe

      - name: Instalar componentes del Android SDK que pide Godot
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "platform-tools" "build-tools;35.0.1" "platforms;android-35" "cmake;3.10.2.4988404" "ndk;28.1.13356709"
      - name: Instalar Godot y plantillas de exportación
        run: |
          BASE="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-${GODOT_RELEASE}"
          wget -q "$BASE/Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_linux.x86_64.zip"
          wget -q "$BASE/Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_export_templates.tpz"
          unzip -q "Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_linux.x86_64.zip"
          mv "Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_linux.x86_64" godot
          chmod +x godot
          TPL="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_RELEASE}"
          mkdir -p "$TPL"
          unzip -q "Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_export_templates.tpz" -d templates_tmp
          mv templates_tmp/templates/* "$TPL"/
      - name: Configurar Godot para exportar a Android
        run: |
          # Llave de depuración (sirve para instalar el APK directamente en un teléfono)
          keytool -genkey -v -keystore "$HOME/debug.keystore" -storepass android -keypass android \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          # Rutas de Java y del Android SDK en la configuración del editor
          mkdir -p "$HOME/.config/godot"
          printf '%s\n' \
            '[gd_resource type="EditorSettings" format=3]' \
            '' \
            '[resource]' \
            "export/android/java_sdk_path = \"$JAVA_HOME\"" \
            "export/android/android_sdk_path = \"$ANDROID_HOME\"" \
            > "$HOME/.config/godot/editor_settings-4.tres"
          cp "$HOME/.config/godot/editor_settings-4.tres" "$HOME/.config/godot/editor_settings-4.7.tres"
          # Godot lee la llave de depuración desde estas variables de entorno
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$HOME/debug.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"
      - name: Activar compresión ETC2/ASTC (Android la exige)
        run: |
          if grep -q '^textures/vram_compression/import_etc2_astc' project.godot; then
            sed -i 's|^textures/vram_compression/import_etc2_astc.*|textures/vram_compression/import_etc2_astc=true|' project.godot
          elif grep -q '^\[rendering\]' project.godot; then
            sed -i '/^\[rendering\]/a textures/vram_compression/import_etc2_astc=true' project.godot
          else
            printf '\n[rendering]\n\ntextures/vram_compression/import_etc2_astc=true\n' >> project.godot
          fi
      - name: Importar recursos del proyecto
        run: ./godot --headless --import || true

      - name: Exportar APK
        run: |
          mkdir -p build/android
          ./godot --headless --export-debug "Android" build/android/juego.apk
          ls -lh build/android
      - name: Guardar el APK como descarga
        uses: actions/upload-artifact@v4
        with:
          name: Juego_Android_APK
          path: build/android/juego.apk
          if-no-files-found: error

  # ==========================================================
  # WINDOWS (.exe)
  # ==========================================================
  export-windows:
    name: Windows (EXE)
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código fuente
        uses: actions/checkout@v4

      - name: Revisar que existe el preset "Windows Desktop"
        run: |
          if [ ! -f export_presets.cfg ] || ! grep -q 'name="Windows Desktop"' export_presets.cfg; then
            echo "::error::Falta el preset Windows Desktop (Proyecto > Exportar > Añadir > Windows Desktop) y subir export_presets.cfg."
            exit 1
          fi
      - name: Instalar Godot y plantillas de exportación
        run: |
          BASE="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-${GODOT_RELEASE}"
          wget -q "$BASE/Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_linux.x86_64.zip"
          wget -q "$BASE/Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_export_templates.tpz"
          unzip -q "Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_linux.x86_64.zip"
          mv "Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_linux.x86_64" godot
          chmod +x godot
          TPL="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_RELEASE}"
          mkdir -p "$TPL"
          unzip -q "Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_export_templates.tpz" -d templates_tmp
          mv templates_tmp/templates/* "$TPL"/
      - name: Importar recursos del proyecto
        run: ./godot --headless --import || true

      - name: Exportar EXE
        run: |
          mkdir -p build/windows
          ./godot --headless --export-release "Windows Desktop" build/windows/juego.exe
          ls -lh build/windows
      - name: Guardar el juego de Windows como descarga
        uses: actions/upload-artifact@v4
        with:
          name: Juego_Windows
          path: build/windows/
          if-no-files-found: error

  # ==========================================================
  # PUBLICAR UNA VERSIÓN (Release) CON LOS DOS ARCHIVOS
  # ==========================================================
  publicar:
    name: Publicar versión
    needs: [export-android, export-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # necesario para crear el Release

    steps:
      - name: Descargar los archivos generados
        uses: actions/download-artifact@v4
        with:
          path: artefactos

      - name: Crear el Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd artefactos
          (cd Juego_Windows && zip -r ../Juego_Windows.zip .)
          gh release create "pre-alfa-${{ github.run_number }}" \
            Juego_Android_APK/juego.apk \
            Juego_Windows.zip \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Pre-alfa ${{ github.run_number }}" \
            --notes "Descarga **juego.apk** para Android o **Juego_Windows.zip** para PC (descomprímelo y abre el .exe)." \
            --prerelease
